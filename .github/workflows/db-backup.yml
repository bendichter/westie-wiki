# Nightly off-site backup of the production SQLite database.
# Pulls a consistent snapshot off the Fly volume, verifies its integrity,
# and stores it as a workflow artifact (30-day retention). Run manually any
# time from the Actions tab.
name: DB Backup

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:

jobs:
  backup:
    name: Snapshot production database
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wake the machine
        run: curl -sf -o /dev/null --retry 3 --retry-delay 5 https://westie.wiki/ && sleep 5

      - name: Write consistent snapshot on the volume
        run: flyctl ssh console -a westie-wiki -C "npx tsx src/db/backup.ts"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SSH_TOKEN }}

      - name: Download snapshot
        run: flyctl ssh sftp get /data/backup.db backup.db -a westie-wiki
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SSH_TOKEN }}

      - name: Verify integrity
        run: |
          sqlite3 backup.db "PRAGMA integrity_check;" | grep -qx ok
          echo "Tables: $(sqlite3 backup.db 'SELECT count(*) FROM sqlite_master WHERE type="table";')"
          echo "Moves:  $(sqlite3 backup.db 'SELECT count(*) FROM moves;')"
          echo "Users:  $(sqlite3 backup.db 'SELECT count(*) FROM users;')"

      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: westie-wiki-db-${{ github.run_id }}
          path: backup.db
          retention-days: 30
          compression-level: 9
