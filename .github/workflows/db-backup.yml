# Nightly off-site backup of the production SQLite database.
# Pulls a consistent snapshot off the Fly volume, verifies its integrity,
# encrypts it with age, and stores only the encrypted file as a workflow
# artifact (30-day retention). The repo is public, so artifacts are
# downloadable by anyone signed in to GitHub: never upload the plaintext.
# The age public key is the BACKUP_AGE_RECIPIENT repository variable; the
# private key is kept offline (see DEPLOY.md). Run manually any time from
# the Actions tab.
name: DB Backup

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:

jobs:
  backup:
    name: Snapshot production database
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wake the machine
        run: curl -sf -o /dev/null --retry 3 --retry-delay 5 https://westie.wiki/ && sleep 5

      - name: Write consistent snapshot on the volume
        run: flyctl ssh console -a westie-wiki -C "npx tsx src/db/backup.ts"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SSH_TOKEN }}

      - name: Download snapshot
        run: flyctl ssh sftp get /data/backup.db backup.db -a westie-wiki
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SSH_TOKEN }}

      - name: Verify integrity
        run: |
          sqlite3 backup.db "PRAGMA integrity_check;" | grep -qx ok
          echo "Tables: $(sqlite3 backup.db 'SELECT count(*) FROM sqlite_master WHERE type="table";')"
          echo "Moves:  $(sqlite3 backup.db 'SELECT count(*) FROM moves;')"
          echo "Users:  $(sqlite3 backup.db 'SELECT count(*) FROM users;')"

      - name: Encrypt snapshot
        run: |
          test -n "$RECIPIENT" || { echo "BACKUP_AGE_RECIPIENT is not set; refusing to upload"; exit 1; }
          sudo apt-get install -y -qq age
          gzip -9 backup.db
          age -r "$RECIPIENT" -o backup.db.gz.age backup.db.gz
          rm backup.db.gz
        env:
          RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}

      - name: Store encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: westie-wiki-db-${{ github.run_id }}
          path: backup.db.gz.age
          retention-days: 30
          compression-level: 0
