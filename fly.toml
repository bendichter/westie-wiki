# fly.toml app configuration file for Westie Wiki
# See https://fly.io/docs/reference/configuration/

app = 'westie-wiki'
primary_region = 'sjc'

# No [processes] section: the Dockerfile CMD handles migrate → optional seed → serve.

[env]
  DATABASE_PATH = '/data/wcs-wiki.db'
  # SEED=1 loads starter content on boot; it's a no-op once moves exist.
  SEED = '1'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
